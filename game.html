<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock_Paper_Scissors</title>
  </head>

  <body class="game-page">
    <header class="game-header">ROCK, PAPER, SCISSORS !</header>
    <p class="js-result" style="color: white">RESULT</p>
    <p class="js-scoreCard" style="color: white"></p>
    <main class="game-main">
      <div class="game-controls">
        <button class="choice-button rock-button" onclick="playGame('rock')">
          ROCK
        </button>
        <button class="choice-button paper-button" onclick="playGame('paper')">
          PAPER
        </button>
        <button
          class="choice-button scissor-button"
          onclick="playGame('scissor')"
        >
          SCISSOR
        </button>
      </div>
      <button class="choice-button reset-button" onclick="resetScore()">
        RESET
      </button>
    </main>

    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losses: 0,
        ties: 0,
      };

      function playGame(playerChoice) {
        const move = computerMove();
        let result;

        if (playerChoice === move) {
          result = "DRAW!";
          score.ties++;
        } else if (
          (playerChoice === "rock" && move === "scissor") ||
          (playerChoice === "paper" && move === "rock") ||
          (playerChoice === "scissor" && move === "paper")
        ) {
          result = "you WIN!";
          score.wins++;
        } else {
          result = "you LOSE!";
          score.losses++;
        }

        localStorage.setItem("score", JSON.stringify(score));
        updateScoreCard();

        document.querySelector(".js-result").innerHTML =
          "Computer picked " + move.toUpperCase() + ", " + result;
      }

      function updateScoreCard() {
        document.querySelector(".js-scoreCard").innerHTML =
          "Wins: " +
          score.wins +
          " Losses: " +
          score.losses +
          " Ties: " +
          score.ties;
      }

      function resetScore() {
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem("score");
        updateScoreCard();
      }

      function computerMove() {
        let computerMove = "";
        if (Math.random() < 1 / 3) {
          computerMove = "rock";
        } else if (Math.random() >= 1 / 3 && Math.random() <= 2 / 3) {
          computerMove = "paper";
        } else computerMove = "scissor";

        return computerMove;
      }
    </script>
  </body>
</html>
