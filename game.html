<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock_Paper_Scissors</title>
  </head>

  <body class="game-page">
    <header class="game-header">ROCK, PAPER, SCISSORS !</header>
    <p class="js-result" style="color: white">RESULT</p>
    <p class="js-scoreCard" style="color: white"></p>
    <main class="game-main">
      <div class="game-controls">
        <button class="choice-button js-rock" type="button">
          <img src="images/hand-back-fist-regular-full.svg" alt="ROCK" />
        </button>
        <button class="choice-button js-paper" type="button">
          <img src="images/hand-regular-full.svg" alt="PAPER" />
        </button>
        <button class="choice-button js-scissor" type="button">
          <img src="images/hand-scissors-regular-full.svg" alt="SCISSORS" />
        </button>
      </div>
      <div class="action-buttons">
        <button
          class="choice-button reset-button js-reset-button"
          type="button"
        >
          RESET
        </button>
        <button
          class="choice-button reset-button js-autoplay-button"
          type="button"
        >
          AUTOPLAY
        </button>
      </div>
    </main>

    <script src="scrpts.js"></script>
  </body>
</html>
