<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock_Paper_Scissors</title>
  </head>

  <body class="game-page">
    <header class="game-header">ROCK, PAPER, SCISSORS !</header>
    <p class="js-result" style="color: white">RESULT</p>
    <p class="js-scoreCard" style="color: white"></p>
    <main class="game-main">
      <div class="game-controls">
        <button class="choice-button" type="button" onclick="playGame('rock')">
          <img src="images/hand-back-fist-regular-full.svg" alt="ROCK" />
        </button>
        <button class="choice-button" type="button" onclick="playGame('paper')">
          <img src="images/hand-regular-full.svg" alt="PAPER" />
        </button>
        <button
          class="choice-button"
          type="button"
          onclick="playGame('scissor')"
        >
          <img src="images/hand-scissors-regular-full.svg" alt="SCISSORS" />
        </button>
      </div>
      <div class="action-buttons">
        <button
          class="choice-button reset-button"
          type="button"
          onclick="resetScore()"
        >
          RESET
        </button>
        <button
          class="choice-button reset-button"
          type="button"
          onclick="autoPlay()"
        >
          AUTOPLAY
        </button>
      </div>
    </main>

    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
        wins: 0,
        losses: 0,
        ties: 0,
      };

      function playGame(playerChoice) {
        const move = computerMove();
        let result;

        if (playerChoice === move) {
          result = "DRAW!";
          score.ties++;
        } else if (
          (playerChoice === "rock" && move === "scissor") ||
          (playerChoice === "paper" && move === "rock") ||
          (playerChoice === "scissor" && move === "paper")
        ) {
          result = "You WIN!";
          score.wins++;
        } else {
          result = "You LOSE!";
          score.losses++;
        }

        localStorage.setItem("score", JSON.stringify(score));
        updateScoreCard();

        document.querySelector(".js-result").innerHTML = `
                  <span class="result-move">Computer: <img src="${getMoveImage(move)}" alt="${move}" /></span>
                  <span class ="result-move">You: <img src="${getMoveImage(playerChoice)}" alt="${playerChoice}" /></span>
                  <strong class="result-message">${result}</strong>
                `;
      }

      function updateScoreCard() {
        document.querySelector(".js-scoreCard").innerHTML =
          "Wins: " +
          score.wins +
          " Losses: " +
          score.losses +
          " Ties: " +
          score.ties;
      }

      function resetScore() {
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem("score");
        updateScoreCard();
      }

      function computerMove() {
        let computerMove = "";
        if (Math.random() < 1 / 3) {
          computerMove = "rock";
        } else if (Math.random() >= 1 / 3 && Math.random() <= 2 / 3) {
          computerMove = "paper";
        } else computerMove = "scissor";

        return computerMove;
      }

      function getMoveImage(move) {
        const moveImages = {
          rock: "images/hand-back-fist-regular-full.svg",
          paper: "images/hand-regular-full.svg",
          scissor: "images/hand-scissors-regular-full.svg",
        };

        return moveImages[move];
      }

      let isautoplaying = false;
      let intervalID;

      function autoPlay() {
        if (!isautoplaying) {
          isautoplaying = true;
          intervalID = setInterval(function () {
            playGame(computerMove());
          }, 2000);
        } else {
          clearInterval(intervalID);
          isautoplaying = false;
        }
      }
    </script>
  </body>
</html>
